build:
  tags:
    - build
  stage: build
  interruptible: true
  timeout: 10m
  extends: .default_windows_utf8
  needs:
    - check-info
    - test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - job_execution_timeout
      - unknown_failure
      - data_integrity_failure
  script:
    - |
      & dotnet build dms.sln -c Release --nologo -v minimal 2>&1 |
        Where-Object { $_ -notmatch 'warning|경고' } | ForEach-Object { Write-Host $_ }
      if ( $LastExitCode -ne 0 ) { Write-Host $RED"Build failed (exit $LastExitCode)"$ESC; Exit $LastExitCode }
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
