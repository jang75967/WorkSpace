build-client:
  tags:
    - build
    - client
  stage: build
  interruptible: true
  timeout: 15m
  extends: .default_windows_utf8
  dependencies:
    - check-info
    - test-unit
    - test-integrated
  needs:
    - check-info
    - test-unit
    - test-integrated
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - job_execution_timeout
      - unknown_failure
      - data_integrity_failure
  script:
    - |
      Write-Host $CYAN"Build stage will be ready soon."$ESC

      # DMS_FLAVOR 기본값 설정: 미지정 시 Memory
      if (-not $env:DMS_FLAVOR -or $env:DMS_FLAVOR -eq "") { $env:DMS_FLAVOR = "Memory" }
      $flavor = $env:DMS_FLAVOR
      if ($flavor -ne "Memory" -and $flavor -ne "Foundry") { Write-Host $RED"Invalid DMS_FLAVOR: $flavor (expected Memory|Foundry)"$ESC; Exit 1 }

      # NuGet 패키지 복원 (DevExpress 24.2 ci 서버의 로컬 소스 사용)
      Write-Host $CYAN"Restoring NuGet packages..."$ESC
      $devExpressSource = "C:\Program Files\DevExpress 24.2\Components\System\Components\packages"
      if (Test-Path $devExpressSource) {
        Write-Host $CYAN"Using DevExpress local source: $devExpressSource"$ESC
        dotnet restore --verbosity minimal --nologo --source "https://api.nuget.org/v3/index.json" --source $devExpressSource
      } else {
        Write-Host $YELLOW"Warning: DevExpress local source not found, using default sources"$ESC
        dotnet restore --verbosity minimal --nologo
      }
      if ( $LastExitCode -ne 0 ) { 
        Write-Host $RED"NuGet restore failed with exit code: $LastExitCode"$ESC
        Exit $LastExitCode 
      }

      .\Setup\build-client.ps1 -Flavor $flavor

      if ( $LastExitCode -ne 0 ) { 
        Write-Host $RED"Build-client failed with exit code: $LastExitCode"$ESC
        Exit $LastExitCode 
      }

      Write-Host $CYAN"Client build completed. Output -> $BUILDDIR"$ESC
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never

# "release_" 또는 "hotfix" 로 시작하는 이름을 가진 브랜치가 push 됐을 때, PublishTest 게시
deploy-client:
  tags:
    - build
    - client
  stage: deploy
  interruptible: true
  timeout: 20m
  retry: 2
  variables:
    GIT_STRATEGY: fetch
  extends: .default_windows_utf8
  script:
    - |
      if (-not $env:DMS_FLAVOR -or $env:DMS_FLAVOR -eq "") { $env:DMS_FLAVOR = "Memory" }
      $flavor = $env:DMS_FLAVOR
      if ($flavor -ne "Memory" -and $flavor -ne "Foundry") { Write-Host $RED"Invalid DMS_FLAVOR: $flavor (expected Memory|Foundry)"$ESC; exit 1 }

      # 테스트용 고정 버전
      $now = Get-Date
      $Version = "{0}.{1:D2}.{2:D2}.{3:HHmm}" -f $now.Year, $now.Month, $now.Day, $now
      $TargetRoot = if ($flavor -eq "Memory") { "\\192.168.170.43\PublishTest" } else { "\\192.168.170.43\PublishTest_Foundry" }
      $ProviderBase = "http://192.168.170.43"
      $ProviderPort = if ($flavor -eq "Memory") { 1234 } else { 1235 }
      $Apps = if ($flavor -eq "Memory") { "AdminTool,Client,Configurator" } else { "AdminTool,Client,Configurator,AutoBBT,LotStatusBoard" }

      # 필요 시 코드서명:
      # $PfxPath = $env:CODESIGN_PFX_PATH
      # $PfxPass = $env:CODESIGN_PFX_PASSWORD

      & ".\Setup\deploy-client.ps1" `
        -SolutionRoot (Get-Location).Path `
        -TargetRoot $TargetRoot `
        -ProviderBaseUrl $ProviderBase `
        -ProviderPort $ProviderPort `
        -Apps (($Apps -split ",") | ForEach-Object { $_.Trim() }) `
        -Version $Version `
        -UseBootstrapper `
        -MakeIndexHtml `
        -DirectToTarget `
        -NoClean `
        -SmbUser "mirero" `
        -SmbPassword "mirero" `
        -Flavor $flavor
      # 서명까지 하려면:
      #   -PfxPath $PfxPath -PfxPassword $PfxPass
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH =~ /^release_/ || $CI_COMMIT_BRANCH =~ /^hotfix/)'
      when: on_success
    - when: never
